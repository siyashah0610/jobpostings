<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar - Waymo</title>
<style>
  :root {
    --ink: #0b1220;
    --panel: #111a2c;
    --line: #21304a;
    --text: #dbe4f3;
    --muted: #7f92b3;
    --signal: #35e0a1;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    line-height: 1.5;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  .eyebrow {
    color: var(--signal);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 0 rgba(53,224,161,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(53,224,161,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(53,224,161,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,224,161,0); }
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 34px;
    margin: 10px 0 4px;
    font-weight: 400;
    color: #fff;
  }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; }
  nav {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  nav a {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  nav a:hover { background: var(--panel); }
  nav a.active { background: var(--accent); color: var(--ink); }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin: 36px 0 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .count { color: var(--accent); font-size: 12px; }
  .job-row {
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .job-info {
    margin-bottom: 8px;
  }
  .job-link {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    flex-wrap: wrap;
  }
  .job-row:hover { background: var(--panel); }
  .title { flex: 1; min-width: 200px; }
  .loc { color: var(--muted); font-size: 12px; }
  .company-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .new-badge {
    background: var(--signal);
    color: #06231a;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }
  .status-toggle {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .status-option {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .status-option input {
    cursor: pointer;
  }
  .status-option span {
    color: var(--muted);
  }
  .status-option input:checked + span {
    color: var(--signal);
    font-weight: 700;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 4px; }
  .error-banner {
    margin-top: 32px;
    padding: 12px 16px;
    border: 1px solid #5a3a1a;
    background: #201409;
    color: #e0b378;
    font-size: 12px;
    border-radius: 4px;
  }
  .error-banner ul { margin: 6px 0 0; padding-left: 18px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Scanning six companies daily</div>
      <h1><a href="index.html">Job Radar</a></h1>
      <div class="subtitle">Last checked 2026-08-26 13:56 UTC</div>
      <nav>
        <a href="index.html" class="active">Home</a><a href="anthropic.html">Anthropic</a><a href="google.html">Google</a><a href="meta.html">Meta</a><a href="nvidia.html">NVIDIA</a><a href="openai.html">OpenAI</a><a href="waymo.html">Waymo</a>
      </nav>
    </header>

    
<p class="empty">No matching postings for this company.</p>

    

    <footer>Tracking 851 previously-seen matching postings across 6 companies.</footer>
  </div>

  <script>
    document.querySelectorAll('input[type="radio"]').forEach(input => {
      input.addEventListener('change', function() {
        const jobId = this.dataset.jobId;
        const status = this.value;
        localStorage.setItem('job-status-' + jobId, status);
      });
    });

    document.querySelectorAll('input[type="radio"]').forEach(input => {
      const jobId = input.dataset.jobId;
      const savedStatus = localStorage.getItem('job-status-' + jobId);
      if (savedStatus && input.value === savedStatus) {
        input.checked = true;
      }
    });
  </script>
</body>
</html>
